student_id: "your_id"

# Put your assignment data here.
# Recommended:
# data/
#   train/images/*.jpg
#   test/images/*.jpg
#   train_labels.csv
data_root: "data"
train_images:
  - "data/train/images"
  - "train/images"
test_images:
  - "data/test/images"
  - "test/images"
label_files:
  - "data/train_labels.csv"
  - "data/labels.csv"
  - "train_labels.csv"
  - "labels.csv"

# Style ids from the original assignment.
styles:
  0:
    name: "oil painting"
    token: "<oilstyle>"
  1:
    name: "watercolor"
    token: "<waterstyle>"
  2:
    name: "pencil coloring"
    token: "<pencilstyle>"

fruits:
  0: "apple"
  1: "asian pear"
  2: "banana"
  3: "cherry"
  4: "pineapple"
  5: "grape"

# Practical best-quality default for local Apple Silicon.
# SDXL can look better, but SD 1.5 LoRA is much more reliable for local MPS training.
base_model: "stable-diffusion-v1-5/stable-diffusion-v1-5"
resolution: 512

training:
  output_dir: "models/lora"
  seed: 42
  train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.0001
  max_train_steps: 1800
  checkpoint_every: 600
  rank: 16
  dataloader_num_workers: 0
  center_crop: true
  random_flip: true
  mixed_precision: "no"

generation:
  output_dir: "release/generated"
  max_images: 20
  num_inference_steps: 32
  guidance_scale: 7.5
  strength: 0.55
  lora_scale: 1.0
  seed: 1234
  negative_prompt: "low quality, blurry, distorted fruit, extra fruit, text, watermark, signature, bad anatomy, noisy"
